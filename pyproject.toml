[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "minecraft-ai"
version = "0.1.0"
description = "Open-source layered Minecraft agent with scoped control, versioned knowledge, planning, memory and continual skills."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Lloyd Handyside" }]
dependencies = [
  "platformdirs>=4.2",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
vision = ["Pillow>=10.4", "numpy>=1.26"]
knowledge = ["httpx>=0.27"]
bedrock-linux = ["python-xlib>=0.33", "mss>=9.0"]
full = [
  "Pillow>=10.4",
  "numpy>=1.26",
  "httpx>=0.27",
  "python-xlib>=0.33",
  "mss>=9.0",
]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
]

[project.scripts]
minecraft-ai = "minecraft_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/minecraft_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
