# Public observation producer bound. The publisher samples the private route
# every 0.5s and posts allowlisted packets; it must never compete with the game.
# Installed live with:
#   systemctl --user set-property minecraft-public-view.service \
#     CPUQuota=100% MemoryMax=2G MemorySwapMax=0
#   renice -n 19 -p <publisher-pid>
[Service]
Nice=19
CPUQuota=100%
MemoryMax=2G
MemorySwapMax=0
