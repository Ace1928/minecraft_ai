name: Gameplay regressions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/minecraft_ai/control/**'
      - 'src/minecraft_ai/skills/**'
      - 'tests/**'
      - '.github/workflows/gameplay-regression.yml'
  pull_request:
    paths:
      - 'src/minecraft_ai/control/**'
      - 'src/minecraft_ai/skills/**'
      - 'tests/**'
      - '.github/workflows/gameplay-regression.yml'

permissions:
  contents: read

concurrency:
  group: gameplay-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gameplay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain exact source for reproducing this regression run
        run: |
          mkdir -p regression-source
          git archive --format=tar.gz --output=regression-source/source.tar.gz HEAD src tests pyproject.toml
          git rev-parse HEAD > regression-source/COMMIT.txt
          sha256sum regression-source/source.tar.gz > regression-source/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gameplay-source-${{ github.sha }}
          path: regression-source/
          retention-days: 1
          if-no-files-found: error
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Exercise mining, adaptive recovery and state persistence
        run: python -m pytest -q tests/test_mining_control.py tests/test_adaptive_gameplay.py tests/test_storage.py --junitxml=gameplay-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gameplay-results-${{ github.sha }}
          path: gameplay-results.xml
          retention-days: 14
          if-no-files-found: warn
