name: Source verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/source-verification.yml'

permissions:
  contents: read

concurrency:
  group: source-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax without loading models or controlling a game
        run: python -m compileall -q src
      - name: Export exact tracked source and provenance
        shell: bash
        run: |
          mkdir -p source-verification
          git archive --format=tar.gz --output=source-verification/source.tar.gz HEAD
          git rev-parse HEAD > source-verification/COMMIT.txt
          sha256sum source-verification/source.tar.gz > source-verification/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ github.sha }}
          path: source-verification/
          retention-days: 3
          if-no-files-found: error
