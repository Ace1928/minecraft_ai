name: Validate traversal upgrade
on:
  push:
    branches: ['agent-upgrade/reactive-20260912']
    paths: ['.github/workflows/upgrade-build.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materialize checksum-pinned patch
        run: |
          python - <<'PY'
          import pathlib,base64,zlib,hashlib
          encoded=pathlib.Path('.upgrade1.b64').read_text().replace('QB17JPJhe','QB17JPJje')
          patch=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='17bbc07810894602dbcf5cb52f3d4a3cfa5c091b60cd4a96be8ee67ac817126a'
          pathlib.Path('/tmp/upgrade.patch').write_bytes(patch)
          PY
          git fetch origin f4061aca1030536dc6a9082c5e3ed8068b63884d
          git checkout --detach f4061aca1030536dc6a9082c5e3ed8068b63884d
          git apply --check /tmp/upgrade.patch
          git apply /tmp/upgrade.patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: mypy src
      - run: python -m pytest -q --junitxml=/tmp/upgrade-tests.xml
      - name: Publish tested source-only commit
        run: |
          git config user.name 'lloydhandyside'
          git config user.email '157781245+Ace1928@users.noreply.github.com'
          git add src tests
          git commit -m 'feat(control): recover all verified traversal stalls and enforce model-independent action permissions'
          git push origin HEAD:refs/heads/agent-upgrade/verified-traversal-20260912
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traversal-upgrade-test-results
          path: /tmp/upgrade-tests.xml
          retention-days: 7
          if-no-files-found: ignore
